[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quixote-dev-bot"
version = "0.1.0"
description = "Telegram lead-intake bot for freelance qualification"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.15,<4",
    "python-dotenv>=1.0,<2",
    "flask>=3,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
